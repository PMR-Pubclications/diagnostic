# ==========================================
# DIAGNOSTIC REPOSITORY PORTABLE CONFIG
# ==========================================

project:
  name: "DiagnosticCore"
  version: "2.0.0"
  role: "Ecosystem Health & Telemetry Hub"

# Workspace & Path Discovery (Supports ENV override: WORKSPACE_ROOT)
workspace:
  default_root_offset: ".."
  env_override: "WORKSPACE_ROOT"

# Target repositories to scan and monitor
target_repositories:
  - name: "Trust-Main"
    relative_path: "Trust-Main"
    role: "Core Trust & Ledger Management"
  - name: "Trust-Shell"
    relative_path: "Trust-Shell"
    role: "User Interface & Voice Routing"
  - name: "AudioVideoEngine-CPP"
    relative_path: "AudioVideoEngine-CPP"
    role: "Hardware Audio/Video Processing"
  - name: "AnnonOS"
    relative_path: "AnnonOS"
    role: "System-level Mobile Environment"

# Security & Handshake Settings
security:
  handshake_protocol: "HMAC-SHA256"
  shared_secret_env_var: "REPO_SHARED_SECRET"
  token_expiration_seconds: 300

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  save_to_file: true
